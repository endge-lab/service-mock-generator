app:
  env: production
  name: service_mock_generator
  public_url: http://localhost:8082
http:
  port: "8082"
  cors_allowed_origins: https://cors-disabled.invalid
grpc:
  enabled: true
  port: 50052
  max_receive_bytes: 3145728
  max_send_bytes: 23068672
  graceful_stop_timeout: 10s
logger:
  level: info
auth:
  enabled: false
service_identity:
  verifier:
    enabled: true
    issuer: https://identity.example.invalid/realms/endge
    jwks_url: https://identity.example.invalid/realms/endge/protocol/openid-connect/certs
    audience: endge-mock-generator
    allowed_callers: endge-service-backend
    allowed_algorithms: RS256
    jwks_cache_ttl: 5m
    timeout: 5s
telemetry:
  enabled: false
tls:
  enabled: true
postgres:
  enabled: false
